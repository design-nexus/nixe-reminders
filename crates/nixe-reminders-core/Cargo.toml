[package]
name = "nixe-reminders-core"
version = "0.1.1"
description = "Tasks, smart lists and local metadata for Nixe Reminders"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
nixe-eds = { git = "https://github.com/design-nexus/nixe-core.git", rev = "5a7166bfc21a5cf86b009d4f604f048eea5f8cf6" }
rusqlite = { version = "0.40", features = ["bundled"] }
