[package]
name = "nixe-reminders-core"
version = "0.1.0"
description = "Tasks, smart lists and local metadata for Nixe Reminders"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
nixe-eds = { git = "https://github.com/design-nexus/nixe-core.git", rev = "87682e6c936b6a4f006639b1a1c099e96346c07c" }
rusqlite = { version = "0.40", features = ["bundled"] }
