[package]
name = "nixe-remindersd"
version = "0.1.0"
description = "Reminder alerts and the open tasks for Glimpse, in the background"
license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "nixe-remindersd"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
gio = "0.22"
glib = "0.22"
nixe-core = { git = "file:///home/ken/Projects/nixe-core", rev = "3a91eb0f0ae6be1bd42750723e17e26bb6dbea0f", default-features = false }
nixe-eds = { git = "file:///home/ken/Projects/nixe-core", rev = "3a91eb0f0ae6be1bd42750723e17e26bb6dbea0f" }
nixe-reminders-core = { path = "../../crates/nixe-reminders-core" }
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
gio = "0.22"
glib = "0.22"
nixe-eds = { git = "file:///home/ken/Projects/nixe-core", rev = "3a91eb0f0ae6be1bd42750723e17e26bb6dbea0f" }
