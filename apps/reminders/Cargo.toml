[package]
name = "nixe-reminders"
version = "0.1.0"
description = "Reminders for Omarchy: your task lists from every account in one place"
license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "nixe-reminders"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
glib = "0.22"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
nixe-accounts = { git = "file:///home/ken/Projects/nixe-core", rev = "3a91eb0f0ae6be1bd42750723e17e26bb6dbea0f" }
nixe-core = { git = "file:///home/ken/Projects/nixe-core", rev = "3a91eb0f0ae6be1bd42750723e17e26bb6dbea0f" }
nixe-eds = { git = "file:///home/ken/Projects/nixe-core", rev = "3a91eb0f0ae6be1bd42750723e17e26bb6dbea0f" }
nixe-reminders-core = { path = "../../crates/nixe-reminders-core" }
nixe-theme = { git = "https://github.com/design-nexus/nixe-design.git", rev = "609c1d2a5af41a8ee3b76ba23611eb30d95a4743" }
nixe-ui = { git = "https://github.com/design-nexus/nixe-design.git", rev = "609c1d2a5af41a8ee3b76ba23611eb30d95a4743" }
nixe-when = { git = "file:///home/ken/Projects/nixe-core", rev = "3a91eb0f0ae6be1bd42750723e17e26bb6dbea0f" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
